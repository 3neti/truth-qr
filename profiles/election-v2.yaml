id: aes-election-v2
version: 2
description: AES signed ballot and existing signed election return Truth QR wire profile
records:
  ballot:
    document_type: waes-ballot
    payload_version: aes-ballot-compact-2
    marker: AES3
    fragmentable: false
    signature: Ed25519
  election_return:
    document_type: waes-election-return
    payload_version: waes-er-compact-1
    fragment_version: waes-er-fragment-1
    marker: WAESER1
    maximum_characters: 900
    signature: Ed25519
